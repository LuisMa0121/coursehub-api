# Semana 13 · Sesión 26 — Automatización de calidad con GitHub Actions
name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Lint, pruebas y build
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias (desde package-lock.json)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Pruebas unitarias
        run: npm test

      - name: Pruebas e2e (SQLite en memoria)
        run: npm run test:e2e

      - name: Build
        run: npm run build

  dependency-review:
    name: Revisión de dependencias
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
